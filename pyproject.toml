[project]
name = "squadcastify"
version = "0.1.0"
description = "Migration framework to migrate OpsGenie/PagerDuty to Squadcast"
requires-python = ">=3.13"
dependencies = [
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "click==8.1.3",
    "pydantic>=2.6.1",
    "tqdm==4.66.1",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.11.11",
]

[tool.ruff]
# Let Ruff use its default configuration
target-version = "py313"
